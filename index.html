<div class="toolbar"><input id="q" placeholder="Search event, venue, city…"><select id="lf"><option value="all">All listing status</option><option value="unlisted">Not listed</option><option value="listed">Listed</option></select><div class="pri"><span>Priority</span><label><input type="checkbox" name="pri" value="P1">🟢 Excellent</label><label><input type="checkbox" name="pri" value="P2">🔵 Good</label><label><input type="checkbox" name="pri" value="P3">🟡 Medium</label><label><input type="checkbox" name="pri" value="P4">🔴 Low</label></div><div id="coverage" class="coverage">Coverage…</div><button id="clearNsAll" class="admin-clear">Clear All NS</button><div id="cnt" class="cnt"></div></div><div id="bulk" class="bulkbar"><span id="bulkCount" class="bulk-count">0 selected</span><button id="markTm" class="bulkbtn tm">Move Selected to Ticketmaster</button><button id="unmarkTm" class="bulkbtn">Move to Non-TM</button><button id="clearSel" class="bulkbtn clear">Clear</button></div><div id="c"></div></div>

<script>
const SB='https://rpngmxrgjmcjzhgaoegq.supabase.co',FEED=SB+'/rest/v1/v_listing_feed_ui',COV=SB+'/rest/v1/v_series_coverage',API=SB+'/rest/v1/listing_events',PAPI=SB+'/rest/v1/listing_performances',OVR=SB+'/rest/v1/series_view_overrides',KEY='sb_publishable_EtA1OzLOhSraN9y8gKpp1g_hCZy8iCg';const USERMAP={symon:'symon@listings.seatsavant.local',manilyn:'manilyn@listings.seatsavant.local',denice:'denice@listings.seatsavant.local',raisha:'raisha@listings.seatsavant.local',diana:'diana@listings.seatsavant.local'};const ALLOWED=new Set(['dunetickets@gmail.com',...Object.values(USERMAP)]);let TOKEN=sessionStorage.getItem('dl_token')||'',REFRESH=sessionStorage.getItem('dl_refresh')||'';
VEN=new Set(["BOSTON - SYMPHONY HALL","CHICAGO - SYMPHONY CTR","DENVER - BOETTCHER","JAX - JACOBY","NASHVILLE - SCHERMERHORN","NYC - CARNEGIE","NYC - GEFFEN","PHILA - ACADEMY","PHILA - MARIAN","PHILA - MET","PHX - ORPHEUM","PHX - SYMPHONY HALL","PITTSBURGH - BENEDUM","PITTSBURGH - HEINZ","PORTLAND - SCHNITZER","SALT LAKE - ECCLES","SEATTLE - BENAROYA","SF - DAVIES","STRATHMORE"]);
const PAGE=1000;let D=[],v='events',TOTAL=0,LOADING=false,SEARCHT=null,TMOPEN=new Set(),GOPEN=new Set(),SEL=new Set();
const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function tokenPayload(){
  try{
    const p=TOKEN.split('.')[1];if(!p)return {};
    const s=p.replace(/-/g,'+').replace(/_/g,'/');const pad=s+'='.repeat((4-s.length%4)%4);
    return JSON.parse(atob(pad));
  }catch(_){return {}}
}
function currentEmail(){return String(tokenPayload().email||'').toLowerCase()}
function currentUser(){
  const m={'dunetickets@gmail.com':'Admin','symon@listings.seatsavant.local':'Symon','manilyn@listings.seatsavant.local':'Manilyn','denice@listings.seatsavant.local':'Denice','raisha@listings.seatsavant.local':'Raisha','diana@listings.seatsavant.local':'Diana'};
  return m[currentEmail()]||currentEmail()||'Unknown';
}
function isAdmin(){return currentEmail()==='dunetickets@gmail.com'}
function actorLine(name,when){
  if(!name)return '';
  let d='';try{if(when)d=' · '+new Date(when).toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}catch(_){}
  return '<span class="actor">by '+e(name)+e(d)+'</span>';
}

function ds(x){if(!x)return'';let a=String(x).split('-');return a.length===3?a[1]+'/'+a[2]+'/'+a[0].slice(2):x}
function av(x){if(x.availability_status==='NOT_ON_SALE')return '<span class="avail">'+(x.onsale_date?'On sale '+e(ds(x.onsale_date)):'Announced · on-sale TBD')+'</span>';if(x.availability_status==='PRESALE')return '<span class="avail">Presale'+(x.onsale_date?' · public '+e(ds(x.onsale_date)):'')+'</span>';return''}
function pl(x){return ({P1:'🟢 Excellent',P2:'🔵 Good',P3:'🟡 Medium',P4:'🔴 Low'})[x]||x||''}
function wk(x){let w=String(x.why_priority||'');return x.priority==='P1'||/(exact (history|product|series|artist|venue)|strong direct history|box office proof|box-office evidence|sold out|current exact event|nutcracker archetype)/i.test(w)}
function usefulWhy(x){
  const bits=[];
  const hp=Number(x.hist_profit)||0,ho=Number(x.hist_orders)||0,vp=Number(x.venue_hist_profit)||0,vo=Number(x.venue_hist_orders)||0,vd=Number(x.venue_hist_event_dates)||0;
  const label=String(x.hist_evidence_label||'').toLowerCase();
  if(ho||hp){
    if(label.includes('comparable')){
      if(v==='comparables')bits.push('Comparable category only: '+ho.toLocaleString()+' orders / '+moneyShort(hp)+' profit');
    } else if(label.includes('artist')||label.includes('company'))bits.push('Artist/company history: '+ho.toLocaleString()+' orders / '+moneyShort(hp)+' profit');
    else bits.push('Production history: '+ho.toLocaleString()+' orders / '+moneyShort(hp)+' profit');
  }
  if(vo||vp)bits.push('Venue history: '+vo.toLocaleString()+' orders / '+moneyShort(vp)+' profit'+(vd?' across '+vd.toLocaleString()+' event dates':''));
  if(bits.length)return bits.join('. ')+'.';
  return String(x.why_priority||'');
}
function evbadge(x){
  const l=String(x.hist_evidence_label||'').toLowerCase(),w=String(x.why_priority||'');
  if(l.includes('comparable'))return v==='comparables'?'<span class="eb comp">Comparable / category</span>':'';
  if(l.includes('artist')||l.includes('company'))return '<span class="eb other">Artist / company history</span>';
  if(l && (x.hist_orders!=null||x.hist_profit!=null))return '<span class="eb exact">Exact / series history</span>';
  if(/external box-office evidence/i.test(w))return '<span class="eb other">External box office</span>';
  if(/current exact event/i.test(w))return '<span class="eb exact">Exact current event</span>';
  if(/exact venue|exact historical/i.test(w))return '<span class="eb venue">Exact venue history</span>';
  if(/category proof|comparable|archetype|touring broadway history/i.test(w))return '<span class="eb comp">Comparable / category</span>';
  return '';
}
function qval(t){return '"*'+String(t).replace(/["\\]/g,'\\$&')+'*"'}

function buildParams(offset,limit){
  const p=new URLSearchParams();
  p.set('select','*');
  p.set('order','listed.asc,priority.asc,event_sort_index.asc,perf_sort_index.asc');
  p.set('limit',limit);p.set('offset',offset);
  if(v==='venues'){
    p.set('source_tab','in.('+[...VEN].map(x=>'"'+x.replace(/["\\]/g,'\\$&')+'"').join(',')+')');
  } else if(v==='events'){
    p.set('view_bucket','eq.events');
  } else if(v==='comparables'){
    p.set('view_bucket','eq.comparables');
  } else if(['SO','ISO','NS'].includes(v)){
    p.set('tag','eq.'+v);
  }
  const q=$('#q').value.trim();
  if(q){
    const qv=qval(q);
    p.set('or','(event_name.ilike.'+qv+',venue.ilike.'+qv+',group_name.ilike.'+qv+',family_name.ilike.'+qv+',why_priority.ilike.'+qv+')');
  }
  const lf=$('#lf').value;
  if(lf==='listed')p.set('listed','eq.true');
  else if(lf==='unlisted')p.set('listed','eq.false');
  const ps=[...document.querySelectorAll('input[name="pri"]:checked')].map(x=>x.value);
  if(ps.length)p.set('priority','in.('+ps.join(',')+')');
  return p;
}
function parseTotal(h){const cr=h.get('content-range');if(!cr)return null;const m=/\/(\d+|\*)$/.exec(cr);return m&&m[1]!=='*'?+m[1]:null}
async function refreshSession(){
  if(!REFRESH)return false;
  const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:REFRESH})});
  if(!r.ok)return false;
  const d=await r.json();
  if(!d.access_token)return false;
  TOKEN=d.access_token;REFRESH=d.refresh_token||REFRESH;
  sessionStorage.setItem('dl_token',TOKEN);sessionStorage.setItem('dl_refresh',REFRESH);
  return true;
}
function clearSession(){
  TOKEN='';REFRESH='';
  sessionStorage.removeItem('dl_token');sessionStorage.removeItem('dl_refresh');
}
async function apiFetch(url,opts={}){
  const headers={...(opts.headers||{}),apikey:KEY,Authorization:'Bearer '+TOKEN};
  let r=await fetch(url,{...opts,headers});
  if(r.status===401&&await refreshSession()){
    const retryHeaders={...(opts.headers||{}),apikey:KEY,Authorization:'Bearer '+TOKEN};
    r=await fetch(url,{...opts,headers:retryHeaders});
  }
  if(r.status===401&&!REFRESH){clearSession();}
  return r;
}

async function fetchPage(offset,limit){
  const r=await apiFetch(FEED+'?'+buildParams(offset,limit).toString(),{headers:{Prefer:'count=exact'}});
  if(!r.ok)throw Error('fetch failed '+r.status);
  const rows=await r.json();
  const total=parseTotal(r.headers);
  return {rows,total};
}
async function tabCount(tag){
  const r=await apiFetch(FEED+'?select=row_id&tag=eq.'+tag+'&limit=1',{headers:{Prefer:'count=exact'}});
  if(!r.ok)return 0;
  return parseTotal(r.headers)||0;
}
async function refreshTabCounts(){
  const [so,iso,ns]=await Promise.all([tabCount('SO'),tabCount('ISO'),tabCount('NS')]);
  const set=(k,n)=>{const el=document.querySelector('[data-count="'+k+'"]');if(el)el.textContent='['+n+']'};
  set('SO',so);set('ISO',iso);set('NS',ns);
}

async function refreshCoverage(){
  const el=$('#coverage');if(!el)return;
  try{
    const r=await apiFetch(COV+'?select=display_name,reference_rows,live_rows&active=eq.true&order=display_name.asc');
    if(!r.ok)throw Error('coverage '+r.status);
    const a=await r.json(),bad=a.filter(x=>Number(x.live_rows)<Number(x.reference_rows));
    const complete=a.length-bad.length;
    el.textContent='Coverage '+complete+'/'+a.length;
    el.classList.remove('ok','warn','bad');
    el.classList.add(bad.length===0?'ok':bad.some(x=>Number(x.live_rows)===0)?'bad':'warn');
    el.title=bad.length?bad.map(x=>x.display_name+': '+x.live_rows+'/'+x.reference_rows).join('\n'):'All approved future source feeds meet or exceed the reference coverage.';
  }catch(err){
    el.textContent='Coverage unavailable';el.classList.remove('ok','warn');el.classList.add('bad');el.title='Coverage audit failed to load.';
  }
}
async function resetAndLoad(){
  D=[];TOTAL=0;
  $('#sync').textContent='Loading…';
  try{
    const first=await fetchPage(0,PAGE);
    D=first.rows;TOTAL=first.total??first.rows.length;
    while(D.length<TOTAL){
      const next=await fetchPage(D.length,PAGE);
      if(!next.rows.length)break;
      D=D.concat(next.rows);
    }

function tag(x){return x.tag||''}
function rowDate(x){
  const s=String(x.performance_date||x.date_text||'').trim();
  let m;
  if((m=s.match(/^(\d{4})-(\d{2})-(\d{2})/)))return new Date(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[1]-1,+m[2]);}
  return null;
}
function isPast(x){const d=rowDate(x);if(!d)return false;const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return d<t}
function isAfterApril1(x){const d=rowDate(x);return !!d&&d>new Date(2027,3,1)}
function inActiveWindow(x){return !isAfterApril1(x)}
const cg='<col class="selcol"><col class="c1"><col class="c2"><col style="width:110px"><col class="c3"><col style="width:90px"><col class="c4"><col class="c5"><col class="c6"><col class="c7"><col class="c8">',hd='<thead><tr><th class="selcol"><input class="selbox select-all-table" type="checkbox" title="Select all rows in this table"></th><th>Listed</th><th>Status</th><th>Purchased</th><th>Date</th><th>Time</th><th>Event</th><th>Venue</th><th>Priority</th><th>Why Priority</th><th>Direct Primary Link</th></tr></thead>';

  const timeCell=isPerf?('<b>'+e(x.time_text||'—')+'</b>'):'—';
  const rk=rowKey(x),checked=SEL.has(rk)?' checked':'';
  const listedBy=x.listed?actorLine(x.listed_by,x.listed_at):'';
  const statusBy=t?actorLine(x.status_by,x.status_at):'';
  const purchaseCell=v==='NS'
    ? '<button class="purchase-btn '+(x.purchased?'on':'')+'" data-p>'+(x.purchased?'✓ Purchased':'Purchased')+'</button>'+(x.purchased?actorLine(x.purchased_by,x.purchased_at):'')
    : (x.purchased?'<span class="purchase-btn on">✓ Purchased</span>'+actorLine(x.purchased_by,x.purchased_at):'—');
  return '<tr data-key="'+e(rk)+'"><td class="selcol"><input class="selbox row-select" type="checkbox" data-select'+checked+'></td><td><button class="li '+(x.listed?'on':'')+'" data-l>'+(x.listed?'✓ Listed':'Listed')+'</button>'+listedBy+'</td><td><div class="cs">'+['SO','ISO','NS'].map(z=>'<button class="st '+(t===z?'on':'')+'" data-t="'+z+'">'+z+'</button>').join('')+'</div>'+statusBy+'</td><td>'+purchaseCell+'</td><td>'+e(x.date_text)+'</td><td>'+timeCell+'</td><td class="ev">'+e(x.event_name)+'</td><td>'+e(x.venue)+'</td><td><span class="p '+e(effectivePriority(x))+'">'+e(pl(effectivePriority(x)))+'</span></td><td class="why '+(wk(x)?'key':'')+'">'+evbadge(x)+e(usefulWhy(x))+'</td><td>'+link+av(x)+'</td></tr>';
}
function isTM(x){return !!x.ticketmaster_override||/(^|\/\/)([^/]*\.)?ticketmaster\./i.test(String(x.primary_url||''))}
function effectivePriority(x){
  const raw=String(x.priority||'P4');
  const label=String(x.hist_evidence_label||'').toLowerCase();
  const hp=Number(x.hist_profit)||0, vp=Number(x.venue_hist_profit)||0, ho=Number(x.hist_orders)||0;
  const comparable=label.includes('comparable');
  const indirect=label.includes('artist')||label.includes('company');
  let econ='P4';
  if(!comparable && !indirect && hp>=10000 && vp>=5000)econ='P1';
  else if(!comparable && hp>=10000)econ='P2';
  else if(!comparable && hp>=5000 && vp>=3000)econ='P2';
  else if(indirect && hp>=10000 && vp>=5000)econ='P2';
  else if(vp>=10000 && ho>0)econ='P2';
  else if(hp>=2500 || vp>=5000)econ='P3';
  const n={P1:1,P2:2,P3:3,P4:4};
  return n[econ]<n[raw]?econ:raw;
}
function priN(x){return ({P1:1,P2:2,P3:3,P4:4})[effectivePriority(x)]||9}
function scarcityN(x){return x.so?0:x.iso?1:x.ns?3:2}
function dateN(x){const s=String(x.performance_date||x.date_text||'');const d=new Date(s);return isNaN(d)?Number.MAX_SAFE_INTEGER:d.getTime()}
function bestRows(r){
  const a=r.filter(x=>!isTM(x));
  const src=a.length?a:r;
  return [...src].sort((a,b)=>(!!a.listed-!!b.listed)||priN(a)-priN(b)||scarcityN(a)-scarcityN(b)||dateN(a)-dateN(b)).slice(0,3);
}
function histConfidence(x){
  const l=String(x.hist_evidence_label||'').toLowerCase();
  if(!x.hist_orders && !x.hist_profit)return 0;
  if(l.includes('comparable'))return v==='comparables' ? .25 : 0;
  if(l.includes('artist')||l.includes('company'))return .80;
  return 1;
}
function groupScore(r){
  const n=r.filter(x=>!isTM(x)),s=n.length?n:r;
  const best=Math.min(...s.map(priN));
  const econ=Math.max(0,...s.map(x=>(Number(x.hist_profit)||0)*histConfidence(x)));
  const rawHist=Math.max(0,...s.map(x=>Number(x.hist_profit)||0));
  const orders=Math.max(0,...s.map(x=>Number(x.hist_orders)||0));
  const scarce=s.filter(x=>x.so||x.iso).length;
  // Economics first. Editorial priority is only a tiebreaker after proven profitability.
  return [-econ,-rawHist,-orders,best,-scarce,-n.length];
}
function groupCmp(a,b){
  const A=groupScore(a[1]),B=groupScore(b[1]);
  return A[0]-B[0]||A[1]-B[1]||A[2]-B[2]||A[3]-B[3]||A[4]-B[4]||A[5]-B[5]||String(a[0]).localeCompare(String(b[0]));
}
function moneyShort(v){
  const n=Number(v);
  if(!isFinite(n))return '—';
  const a=Math.abs(n);
  if(a>=1000000)return '$'+(n/1000000).toFixed(1).replace(/\.0$/,'')+'m';
  if(a>=1000)return '$'+(n/1000).toFixed(1).replace(/\.0$/,'')+'k';
  return '$'+Math.round(n).toLocaleString();
}
function histKpi(r){
  const x=r.find(z=>z.hist_orders!=null);
  if(!x)return '<span class="hist-none">No direct history found</span>';
  const orders=Number(x.hist_orders).toLocaleString();
  const profit=moneyShort(x.hist_profit);
  const margin=x.hist_profit_margin!=null?(Number(x.hist_profit_margin)*100).toFixed(1)+'%':'—';
  const label=String(x.hist_evidence_label||'Internal history');
  const isComp=/comparable/i.test(label),isArtist=/artist|company/i.test(label);
  if(isComp && v!=='comparables')return '<span class="hist-none">No direct production history</span>';
  const type=isComp?'Comparable only':isArtist?'Artist / Company':'Exact';
  const cls=isComp?' comp':isArtist?' artist':'';
  const ordersLabel=isComp?'Comp Orders':'Hist Orders';
  const profitLabel=isComp?'Comp Profit':'Hist Profit';
  return '<span class="hist-kpis" title="'+e(label)+'">'
    +'<span class="hist-type'+cls+'">'+e(type)+'</span>'
    +'<span class="hist-box"><span class="hist-label">'+ordersLabel+'</span><span class="hist-value">'+e(orders)+'</span></span>'
    +'<span class="hist-box profit"><span class="hist-label">'+profitLabel+'</span><span class="hist-value">'+e(profit)+'</span></span>'
    +'<span class="hist-box margin"><span class="hist-label">Margin</span><span class="hist-value">'+e(margin)+'</span></span>'
    +'</span>';
}
function seriesSummary(r){
  const n=r.filter(x=>!isTM(x)),s=n.length?n:r;
  const counts={P1:0,P2:0,P3:0,P4:0};s.forEach(x=>{const p=effectivePriority(x);if(counts[p]!=null)counts[p]++});
  const scarce=s.filter(x=>x.so||x.iso).length;
  const bits=[];
  if(counts.P1)bits.push('🟢 '+counts.P1+' Excellent');
  if(counts.P2)bits.push('🔵 '+counts.P2+' Good');
  if(counts.P3)bits.push('🟡 '+counts.P3+' Medium');
  if(counts.P4)bits.push('🔴 '+counts.P4+' Low');
  bits.push(n.length+' non-TM');
  if(scarce)bits.push(scarce+' SO/ISO');
  return '<div class="series-meta">'+bits.map(x=>'<span class="series-stat">'+e(x)+'</span>').join('')+'</div>';
}
function compactPick(x){
  const st=x.so?'SO':x.iso?'ISO':'';
  return '<div class="series-pick"><div><span class="p '+e(effectivePriority(x))+'">'+e(pl(effectivePriority(x)))+'</span></div><div class="sp-date">'+e(x.date_text||'')+'</div><div class="sp-event">'+e(x.event_name||'')+'</div><div class="sp-venue">'+e(x.venue||'')+(st?' <span class="sp-status">· '+st+'</span>':'')+'</div></div>';
}

}

  const clearBtn=$('#clearNsAll');if(clearBtn)clearBtn.style.display=(v==='NS'&&isAdmin())?'inline-block':'none';
  const V=D.filter(x=>!isPast(x)).filter(x=>v==='after-april'?isAfterApril1(x):inActiveWindow(x));

  let html=groups.map(([z,r])=>{

      : (promoted?'<span class="actor">Promoted by '+e((r[0]&&r[0].promoted_by)||'user')+'</span>':'');
    let head='<div class="gt" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><span class="series-title">'+e(z)+'</span><span class="series-count">· '+r.length+'</span>'+((v==='events'||v==='comparables'||v==='after-april')?histKpi(r):'')+promoteControl+groupToggle+'</div>';
    if(!groupOpen)return '<section class="grp">'+head+((v==='events'||v==='comparables'||v==='after-april')?seriesSummary(r)+picksBlock(r):'')+'</section>';

  if(D.length<TOTAL){html+='<button class="more" id="more" '+(LOADING?'disabled':'')+'>'+(LOADING?'Loading…':'Load '+Math.min(PAGE,TOTAL-D.length)+' more (of '+(TOTAL-D.length)+' remaining)')+'</button>'}

async function bulkTM(value){
  const chosen=D.filter(x=>SEL.has(rowKey(x)));
  if(!chosen.length)return;
  const perf=chosen.filter(x=>x.row_kind==='performance').map(x=>x.performance_id);
  const ev=chosen.filter(x=>x.row_kind!=='performance').map(x=>x.event_id);
  $('#sync').textContent='Saving…';
  const calls=[];
  if(perf.length)calls.push(apiFetch(PAPI+'?id=in.('+perf.join(',')+')',{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({ticketmaster_override:value,manual_override:true,updated_at:new Date().toISOString()})}));
  if(ev.length)calls.push(apiFetch(API+'?id=in.('+ev.join(',')+')',{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({ticketmaster_override:value,manual_override:true,updated_at:new Date().toISOString()})}));
  const rs=await Promise.all(calls);
  if(rs.some(r=>!r.ok)){alert('Could not update all selected rows.');$('#sync').textContent='Save error';return}
  chosen.forEach(x=>x.ticketmaster_override=value);
  if(value){chosen.forEach(x=>{const z=(v==='venues'?(x.venue||'Uncategorized'):(x.family_name||x.group_name||'Uncategorized'));TMOPEN.add(v+'::'+z);GOPEN.add(v+'::'+z)})}
  SEL.clear();
  $('#sync').textContent='Saved';setTimeout(()=>$('#sync').textContent='Live · shared',700);
  render();
}
function bind(){

    const x=map.get(tr.dataset.key);if(!x)return;

    const pb=tr.querySelector('[data-p]');if(pb)pb.onclick=()=>save(x,{purchased:!x.purchased});
    const cb=tr.querySelector('[data-select]');
    if(cb)cb.onchange=()=>{cb.checked?SEL.add(rowKey(x)):SEL.delete(rowKey(x));updateBulk()};
  });
  document.querySelectorAll('.select-all-table').forEach(cb=>cb.onchange=()=>{
    const rows=[...cb.closest('table').querySelectorAll('tbody tr[data-key]')];
    rows.forEach(tr=>{const x=map.get(tr.dataset.key);if(!x)return;cb.checked?SEL.add(rowKey(x)):SEL.delete(rowKey(x));const rcb=tr.querySelector('[data-select]');if(rcb)rcb.checked=cb.checked});

}
