<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Dune Listings</title><style>
:root{--bg:#f6f9fc;--panel:#fff;--text:#1a1f36;--muted:#697386;--line:#e6e9ef;--accent:#635bff;--accent-soft:#f1f0ff;--shadow:0 1px 2px rgba(50,50,93,.05),0 1px 3px rgba(0,0,0,.04)}
*{box-sizing:border-box}body{margin:0;font:13px Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}header{background:rgba(255,255,255,.96);color:var(--text);padding:15px 24px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:9;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{font-size:18px;letter-spacing:-.02em;margin:0}.sub,.sync{font-size:11px;color:var(--muted)}.wrap{max-width:1680px;margin:auto;padding:20px 24px}.tabs{display:flex;gap:18px;margin:0 0 16px;border-bottom:1px solid var(--line)}button,select,input{font:inherit}.tabs button{border:0;background:transparent;padding:9px 1px 10px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}.tabs .on{color:var(--text);border-bottom-color:var(--accent)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:transparent;padding:0;margin-bottom:14px}.toolbar input,.toolbar select{border:1px solid #d9dee8;background:white;border-radius:7px;padding:8px 10px;color:var(--text);outline:none;box-shadow:0 1px 1px rgba(0,0,0,.02)}.toolbar input:focus,.toolbar select:focus{border-color:#a5a1ff;box-shadow:0 0 0 3px rgba(99,91,255,.08)}.toolbar input{flex:1;min-width:260px}.pri{display:flex;align-items:center;gap:9px;padding:0 4px}.pri>span{font-size:10px;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.045em}.pri label{display:flex;align-items:center;gap:4px;color:#596579;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap}.pri input{appearance:none;width:13px;height:13px;margin:0;border:1px solid #cfd5df;border-radius:3px;background:white;padding:0;box-shadow:none;cursor:pointer}.pri input:checked{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px white}.cnt{margin-left:auto;color:var(--muted);padding:8px 2px;font-size:11px}.grp,.flat{background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}.gt{background:white;padding:12px 14px;font-weight:650;font-size:13px;letter-spacing:-.01em;border-bottom:1px solid var(--line)}table{border-collapse:collapse;width:100%;table-layout:fixed}th{background:#fbfcfe;color:#8b95a7;font-size:9px;letter-spacing:.055em;text-transform:uppercase;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-weight:700}td{padding:10px;border-bottom:1px solid #edf0f5;vertical-align:top;line-height:1.4;font-size:12px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fcfcff}.ev{font-weight:650;color:#20263a}.url{display:inline-block;color:#4f46e5;word-break:break-word;text-decoration:none;font-weight:600}.url:hover{text-decoration:underline}.why{color:#566074}.why.key{color:#30384c;font-weight:600;box-shadow:inset 2px 0 var(--accent);padding-left:12px}.src{color:#8b95a7;font-size:10px}.p{display:inline-block;font-weight:700;font-size:9px;letter-spacing:.01em;padding:4px 7px;border-radius:999px;background:#f3f5f7;color:#596579;white-space:nowrap}.p.P1{background:var(--accent);color:white}.p.P2{background:var(--accent-soft);color:#5148d8}.p.P3{background:#f1f3f5;color:#667085}.p.P4{background:transparent;color:#98a2b3;padding-left:0;padding-right:0}.cs{display:flex;gap:4px;flex-wrap:wrap}.st,.li{border:1px solid #dde2ea;background:white;border-radius:6px;cursor:pointer;font-weight:600;font-size:9px;padding:4px 6px;color:#667085}.st:hover,.li:hover{border-color:#b9c0cc}.st.on,.li.on{background:var(--accent-soft);border-color:#c8c5ff;color:#5148d8}.st.ot.on{background:var(--accent-soft);border-color:#c8c5ff}.note{display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#635bff;font-size:9px;margin-top:4px}.modalbg{display:none;position:fixed;inset:0;background:rgba(16,24,40,.34);align-items:center;justify-content:center;z-index:99}.modalbg.on{display:flex}.modal{background:white;width:min(420px,92vw);border-radius:10px;padding:20px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(50,50,93,.15)}.modal h3{margin:0 0 5px}.modal p{color:var(--muted);font-size:12px}.modal textarea{width:100%;min-height:80px;border:1px solid #d9dee8;border-radius:7px;padding:9px;outline:none}.modal textarea:focus{border-color:#a5a1ff;box-shadow:0 0 0 3px rgba(99,91,255,.08)}.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.ma button{border:1px solid #dde2ea;border-radius:6px;padding:7px 12px;background:white;color:var(--text)}.ma .save{background:var(--accent);border-color:var(--accent);color:white}.empty{text-align:center;padding:38px;background:white;border:1px solid var(--line);border-radius:9px;color:var(--muted);box-shadow:var(--shadow)}.saving{opacity:.45;pointer-events:none}
.c1{width:68px}.c2{width:175px}.c3{width:125px}.c4{width:215px}.c5{width:215px}.c6{width:110px}.c7{width:310px}.c8{width:285px}.c9{width:125px}
@media(max-width:900px){.wrap{padding:12px}.toolbar input{min-width:100%}.grp,.flat{overflow-x:auto}table{min-width:1320px}}
</style></head><body><div id="login" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px"><div style="width:min(420px,100%);background:white;border:1px solid #dce2e8;border-radius:10px;padding:24px"><h1 style="color:#172536;margin-bottom:4px">Dune Listings</h1><div style="color:#687586;margin-bottom:18px">Private access</div><input id="email" type="email" value="dunetickets@gmail.com" style="width:100%;padding:10px;border:1px solid #dce2e8;border-radius:6px;margin-bottom:8px"><input id="password" type="password" placeholder="Password" style="width:100%;padding:10px;border:1px solid #dce2e8;border-radius:6px;margin-bottom:10px"><button id="loginbtn" style="width:100%;padding:10px;border:0;border-radius:6px;background:#172536;color:white;font-weight:700;cursor:pointer">Sign in</button><button id="signupbtn" style="display:none;width:100%;padding:10px;border:1px solid #dce2e8;border-radius:6px;background:white;margin-top:8px;font-weight:700;cursor:pointer">Create first-time account</button><div id="authmsg" style="margin-top:10px;color:#687586;font-size:12px"></div></div></div><div id="app" style="display:none"><header><div><h1>Dune Listings</h1><div class="sub">Shared event-listing workflow</div></div><div style="display:flex;gap:10px;align-items:center"><div class="sync" id="sync">Loading…</div><button id="logout" style="border:1px solid #dde2ea;background:white;color:#566074;border-radius:6px;padding:5px 8px;cursor:pointer">Sign out</button></div></header><div class="wrap">
<div class="tabs"><button data-v="events" class="on">Events</button><button data-v="venues">Venues</button><button data-v="SO">Sold Out <span data-count="SO"></span></button><button data-v="ISO">ISO <span data-count="ISO"></span></button><button data-v="NS">NS <span data-count="NS"></span></button><button data-v="OTHER">Other <span data-count="OTHER"></span></button></div>
<div class="toolbar"><input id="q" placeholder="Search event, venue, city…"><select id="lf"><option value="all">All listing status</option><option value="unlisted">Not listed</option><option value="listed">Listed</option></select><div class="pri"><span>Priority</span><label><input type="checkbox" name="pri" value="P1">P1</label><label><input type="checkbox" name="pri" value="P2">P2</label><label><input type="checkbox" name="pri" value="P3">P3</label><label><input type="checkbox" name="pri" value="P4">P4</label></div><div id="cnt" class="cnt"></div></div><div id="c"></div></div>
<div id="mb" class="modalbg"><div class="modal"><h3>Other</h3><p id="me"></p><textarea id="mn" maxlength="250" placeholder="Short note"></textarea><div class="ma"><button id="mc">Cancel</button><button id="ms" class="save">Save</button></div></div></div>
<script>
const SB='https://rpngmxrgjmcjzhgaoegq.supabase.co',API=SB+'/rest/v1/listing_events',PAPI=SB+'/rest/v1/listing_performances',KEY='sb_publishable_EtA1OzLOhSraN9y8gKpp1g_hCZy8iCg',APPROVED='dunetickets@gmail.com';let TOKEN=sessionStorage.getItem('dl_token')||'';VEN=new Set(["BOSTON - SYMPHONY HALL","CHICAGO - SYMPHONY CTR","DENVER - BOETTCHER","JAX - JACOBY","NASHVILLE - SCHERMERHORN","NYC - CARNEGIE","NYC - GEFFEN","PHILA - ACADEMY","PHILA - MARIAN","PHILA - MET","PHX - ORPHEUM","PHX - SYMPHONY HALL","PITTSBURGH - BENEDUM","PITTSBURGH - HEINZ","PORTLAND - SCHNITZER","SALT LAKE - ECCLES","SEATTLE - BENAROYA","SF - DAVIES","STRATHMORE"]);let D=[],v='events',M=null;const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function tag(x){return x.so?'SO':x.iso?'ISO':x.ns?'NS':x.other?'OTHER':''}function pl(x){return ({P1:'P1 Priority',P2:'P2 Core',P3:'P3 Selective',P4:'P4 Monitor'})[x]||x||''}function wk(x){let w=String(x.why_priority||'');return x.priority==='P1'||/(exact (history|product|series|artist|venue)|strong direct history|box office proof|box-office evidence|sold out|current exact event|nutcracker archetype)/i.test(w)}
async function load(){
  const h={apikey:KEY,Authorization:'Bearer '+TOKEN};
  const [er,pr]=await Promise.all([
    fetch(API+'?select=*&order=sort_index.asc',{headers:h}),
    fetch(PAPI+'?select=*&order=performance_date.asc,sort_index.asc',{headers:h})
  ]);
  if(!er.ok||!pr.ok)throw Error();
  const E=await er.json(),P=await pr.json(),pm=new Map();
  P.forEach(p=>{if(!pm.has(p.event_id))pm.set(p.event_id,[]);pm.get(p.event_id).push(p)});
  D=[];
  E.forEach(x=>{
    const ps=pm.get(x.id);
    if(ps&&ps.length){
      ps.forEach(p=>D.push({...x,...p,id:p.id,event_id:x.id,date_text:p.date_display,time_text:p.performance_time,primary_url:p.direct_url,_performance:true}));
    }else D.push({...x,time_text:'',_performance:false});
  });
  $('#sync').textContent='Live · shared · build 09/19';counts();render()
}
function counts(){['SO','ISO','NS','OTHER'].forEach(t=>{let ids=new Set(D.filter(x=>tag(x)===t).map(x=>x._performance?x.event_id:x.id));let n=document.querySelector('[data-count="'+t+'"]');if(n)n.textContent='['+ids.size+']'})}function filt(){let a=D.slice();if(v==='venues')a=a.filter(x=>VEN.has(x.source_tab));else if(['SO','ISO','NS','OTHER'].includes(v))a=a.filter(x=>tag(x)===v);let q=$('#q').value.trim().toLowerCase();if(q)a=a.filter(x=>[x.group_name,x.event_name,x.venue,x.why_priority].some(y=>String(y||'').toLowerCase().includes(q)));let f=$('#lf').value;if(f==='listed')a=a.filter(x=>x.listed);if(f==='unlisted')a=a.filter(x=>!x.listed);let ps=[...document.querySelectorAll('input[name="pri"]:checked')].map(x=>x.value);if(ps.length)a=a.filter(x=>ps.includes(x.priority));return a}
const cg='<col class="c1"><col class="c2"><col class="c3"><col style="width:90px"><col class="c4"><col class="c5"><col class="c6"><col class="c7"><col class="c8">',hd='<thead><tr><th>Listed</th><th>Status</th><th>Date</th><th>Time</th><th>Event</th><th>Venue</th><th>Priority</th><th>Why Priority</th><th>Direct Primary Link</th></tr></thead>';
function row(x){let t=tag(x);if(!x._performance){return '<tr data-run="'+x.id+'"><td>—</td><td>—</td><td>'+e(x.date_text)+'</td><td>—</td><td class="ev">'+e(x.event_name)+'</td><td>'+e(x.venue)+'</td><td><span class="p '+e(x.priority)+'">'+e(pl(x.priority))+'</span></td><td class="why '+(wk(x)?'key':'')+'">'+e(x.why_priority)+'</td><td><span class="src" style="font-weight:700">INDIVIDUAL PERFORMANCES NOT YET LOADED</span></td></tr>'}let link=x.direct_url_verified&&x.primary_url?'<a class="url" style="font-weight:800" target="_blank" rel="noopener" href="'+e(x.primary_url)+'">DIRECT LINK</a>':(x.primary_url?'<a class="url" target="_blank" rel="noopener" href="'+e(x.primary_url)+'">PRIMARY PAGE</a>':'<span class="src">Exact link pending</span>');return '<tr data-id="'+x.id+'"><td><button class="li '+(x.listed?'on':'')+'" data-l>'+(x.listed?'✓ Listed':'Listed')+'</button></td><td><div class="cs">'+['SO','ISO','NS','OTHER'].map(z=>'<button class="st '+(z==='OTHER'?'ot ':'')+(t===z?'on':'')+'" data-t="'+z+'">'+z+'</button>').join('')+'</div>'+(x.other_note?'<span class="note" title="'+e(x.other_note)+'">'+e(x.other_note)+'</span>':'')+'</td><td>'+e(x.date_text)+'</td><td><b>'+e(x.time_text||'—')+'</b></td><td class="ev">'+e(x.event_name)+'</td><td>'+e(x.venue)+'</td><td><span class="p '+e(x.priority)+'">'+e(pl(x.priority))+'</span></td><td class="why '+(wk(x)?'key':'')+'">'+e(x.why_priority)+'</td><td>'+link+'</td></tr>'}
function render(){let a=filt(),direct=a.filter(x=>x._performance&&x.direct_url_verified&&x.primary_url).length;$('#cnt').textContent=a.length+' rows · '+direct+' direct links';if(!a.length){$('#c').innerHTML='<div class="empty">No matching events.</div>';return}let k=v==='venues'?'venue':'group_name',g=new Map();a.forEach(x=>{let z=x[k]||'Other';if(!g.has(z))g.set(z,[]);g.get(z).push(x)});$('#c').innerHTML=[...g].map(([z,r])=>'<section class="grp"><div class="gt">'+e(z)+' <span style="font-weight:500;color:#687586">· '+r.length+'</span></div><table><colgroup>'+cg+'</colgroup>'+hd+'<tbody>'+r.map(row).join('')+'</tbody></table></section>').join('');bind()}
function bind(){document.querySelectorAll('tr[data-id]').forEach(tr=>{let x=D.find(y=>y.id==tr.dataset.id);tr.querySelector('[data-l]').onclick=()=>save(x,{listed:!x.listed});tr.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>clicktag(x,b.dataset.t))})}
async function save(x,p){let tr=document.querySelector('tr[data-id="'+x.id+'"]');if(tr)tr.classList.add('saving');let target=x._performance?PAPI:API;let r=await fetch(target+'?id=eq.'+x.id,{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({...p,updated_at:new Date().toISOString()})});if(!r.ok){alert('Could not save.');render();return}let a=await r.json();Object.assign(x,a[0]||p);$('#sync').textContent='Saved';setTimeout(()=>$('#sync').textContent='Live · shared',700);counts();render()}
function clicktag(x,t){if(t==='OTHER'){M=x;$('#me').textContent=x.event_name+' · '+x.venue;$('#mn').value=x.other_note||'';$('#mb').classList.add('on');setTimeout(()=>$('#mn').focus(),20);return}let k=t==='NS'?'ns':t.toLowerCase(),on=!!x[k];save(x,{so:false,iso:false,ns:false,other:false,other_note:'',[k]:!on})}
$('.tabs').onclick=a=>{let b=a.target.closest('button[data-v]');if(!b)return;v=b.dataset.v;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()};['q','lf'].forEach(i=>$('#'+i).addEventListener(i==='q'?'input':'change',render));document.querySelectorAll('input[name="pri"]').forEach(x=>x.addEventListener('change',render));$('#mc').onclick=()=>{$('#mb').classList.remove('on');M=null};$('#mb').onclick=x=>{if(x.target===$('#mb'))$('#mc').click()};$('#ms').onclick=()=>{if(!M)return;let x=M,n=$('#mn').value.trim();$('#mb').classList.remove('on');M=null;save(x,{so:false,iso:false,ns:false,other:true,other_note:n})};async function auth(mode){const email=$('#email').value.trim().toLowerCase(),password=$('#password').value;if(email!==APPROVED){$('#authmsg').textContent='This email is not authorized.';return}$('#authmsg').textContent=mode==='signup'?'Creating account…':'Signing in…';const path=mode==='signup'?'/auth/v1/signup':'/auth/v1/token?grant_type=password';const r=await fetch(SB+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok){$('#authmsg').textContent=d.msg||d.error_description||d.message||'Sign-in failed.';if(mode==='login')$('#signupbtn').style.display='block';return}if(!d.access_token){$('#authmsg').textContent='Account created. Check the email inbox for a confirmation link, then sign in.';$('#signupbtn').style.display='none';return}TOKEN=d.access_token;sessionStorage.setItem('dl_token',TOKEN);$('#login').style.display='none';$('#app').style.display='block';load().catch(()=>{$('#sync').textContent='Connection error';$('#c').innerHTML='<div class="empty">Unable to load shared listings.</div>'})}
$('#loginbtn').onclick=()=>auth('login');$('#signupbtn').onclick=()=>auth('signup');$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')auth('login')});$('#logout').onclick=()=>{sessionStorage.removeItem('dl_token');TOKEN='';location.reload()};if(TOKEN){$('#login').style.display='none';$('#app').style.display='block';load().catch(()=>{sessionStorage.removeItem('dl_token');location.reload()})}
</script></div></body></html>
