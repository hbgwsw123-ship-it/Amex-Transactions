  if(counts.P2)bits.push('🔵 '+counts.P2+' Good');
  if(counts.P3)bits.push('🟡 '+counts.P3+' Medium');

function axsRunPaint(){
  const box=$('#axsRun');if(!box)return;

  const r=AXSRUN,act=axsRunActive();let msg='',muted=false,ids=[];
  if(r&&r.status==='queued'){muted=true;msg='Queued. The PC checks every 5 minutes, then the run takes about '+axsDur(r.eta_seconds)+'.'}
  else if(r&&r.status==='running'){
    muted=true;

    msg=(left>0?'Running… about '+axsDur(left)+' left':'Running… taking longer than expected')+(ph?' · '+ph:'');
  }else if(r&&r.status==='done'){
    const n=r.added_count||0,when=r.finished_at?new Date(r.finished_at).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';

function axsRunSchedule(){

  AXSRUNTICK=setInterval(axsRunPaint,1000);

  const poll=async()=>{
    if(v!=='axs-obscure')return;

  $('#sync').textContent='Saving…';

  const calls=[];

  if(ev.length)calls.push(apiFetch(API+'?id=in.('+ev.join(',')+')',{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(payload)}));

async function save(x,p){
  const tr=document.querySelector('tr[data-key="'+CSS.escape(rowKey(x))+'"]');if(tr)tr.classList.add('saving');
  const target=x.row_kind==='axs'?AXSAPI:(x.row_kind==='performance'?PAPI:API);
  const id=x.row_kind==='axs'?x.id:(x.row_kind==='performance'?x.performance_id:x.event_id);
  const r=await apiFetch(target+'?id=eq.'+id,{method:'PATCH',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({...p,updated_at:new Date().toISOString()})});
  if(!r.ok){alert('Could not save.');v==='axs-obscure'?renderAxsObscure():render();return}
  const a=await r.json();Object.assign(x,a[0]||p);
  let activity=null;
  if('listed' in p)activity=p.listed?'listed':'unlisted';
  if('so' in p||'iso' in p||'ns' in p)activity=p.so?'status_so':p.iso?'status_iso':p.ns?'status_ns':'status_cleared';
  if('purchased' in p)activity=p.purchased?'purchased':'purchase_cleared';
  if(activity)logActivity(activity,x);
  if('so' in p||'iso' in p||'ns' in p){x.tag=x.so?'SO':x.iso?'ISO':x.ns?'NS':'';if(x.row_kind!=='axs')refreshTabCounts()}
  $('#sync').textContent='Saved';setTimeout(()=>$('#sync').textContent='Live · shared',700);
  v==='axs-obscure'?renderAxsObscure():render();
}

let PA_SHOW_REJECTED=false;
async function fetchApprovalRows(filter){const r=await fetch(SB+'/rest/v1/listing_access_approvals?select=email,first_name,last_name,team,provider,rejected_at&'+filter+'&order=email.asc',{headers:{apikey:KEY,Authorization:'Bearer '+TOKEN}});if(!r.ok)throw Error('approval list failed ('+r.status+')');return r.json()}
async function setApproval(email,approve){const body=approve?{approved:true,rejected_at:null}:{approved:false,rejected_at:new Date().toISOString()};const r=await fetch(SB+'/rest/v1/listing_access_approvals?email=eq.'+encodeURIComponent(email),{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(body)});if(!r.ok)throw Error('update failed ('+r.status+')');const rows=await r.json();if(!rows.length)throw Error('no row updated for '+email);return true}
async function renderPendingApprovals(){
  const box=document.getElementById('pa-list');if(!box)return;
  try{
    const rows=await fetchApprovalRows(PA_SHOW_REJECTED?'approved=eq.false&rejected_at=not.is.null':'approved=eq.false&rejected_at=is.null');
    box.textContent='';
    const toggle=document.createElement('div');toggle.style.cssText='margin-bottom:8px';
    const tb=document.createElement('button');tb.textContent=PA_SHOW_REJECTED?'Show pending':'Show rejected';tb.style.cssText='border:0;background:none;color:#2457a6;cursor:pointer;padding:0;font-size:13px';tb.onclick=()=>{PA_SHOW_REJECTED=!PA_SHOW_REJECTED;renderPendingApprovals()};toggle.appendChild(tb);box.appendChild(toggle);
    if(!rows.length){const n=document.createElement('div');n.textContent=PA_SHOW_REJECTED?'No rejected accounts.':'No accounts are waiting for approval.';box.appendChild(n);return}
    rows.forEach(r=>{
      const row=document.createElement('div');row.style.cssText='display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-top:1px solid #edf0f5';
      const who=document.createElement('div');const name=[r.first_name,r.last_name].filter(Boolean).join(' ');
      who.textContent=r.email+(name?' - '+name:'')+(r.team?' ('+r.team+')':'')+(r.provider?' · '+r.provider:'');
      const btns=document.createElement('div');btns.style.cssText='display:flex;gap:6px;flex:none';
      const mk=(label,color,approve)=>{const b=document.createElement('button');b.textContent=label;b.style.cssText='border:1px solid #dde2ea;background:white;color:'+color+';border-radius:6px;padding:5px 10px;cursor:pointer;font-weight:650';b.onclick=async()=>{if(!approve&&!confirm('Reject '+r.email+'? They stay out of the listings until you approve them again.'))return;btns.querySelectorAll('button').forEach(x=>x.disabled=true);b.textContent=approve?'Approving...':'Rejecting...';try{await setApproval(r.email,approve);await renderPendingApprovals()}catch(err){alert(err.message);btns.querySelectorAll('button').forEach(x=>x.disabled=false);b.textContent=label}};return b};
      btns.append(mk('Approve','#166534',true));
      if(!PA_SHOW_REJECTED)btns.append(mk('Reject','#b42318',false));
      row.append(who,btns);box.appendChild(row)});
  }catch(err){box.textContent='Could not load accounts: '+err.message}
}
async function openPendingApprovals(){
  const old=document.getElementById('pa-modal');if(old)old.remove();
  const m=document.createElement('div');m.id='pa-modal';
  m.style.cssText='position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:1000';
  m.innerHTML='<div style="background:white;border-radius:10px;padding:18px 20px;min-width:360px;max-width:560px;box-shadow:0 10px 30px rgba(0,0,0,.2)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>Pending approvals</b><button id="pa-close" style="border:0;background:none;font-size:18px;cursor:pointer">&times;</button></div><div id="pa-list" style="font-size:13px;color:#344054">Loading...</div></div>';
  document.body.appendChild(m);
  m.querySelector('#pa-close').onclick=()=>m.remove();
  m.onclick=e=>{if(e.target===m)m.remove()};
  PA_SHOW_REJECTED=false;
  await renderPendingApprovals();
}
function enterApp(){sessionStorage.setItem('dl_token',TOKEN);if(REFRESH)sessionStorage.setItem('dl_refresh',REFRESH);$('#login').style.display='none';$('#app').style.display='block';setAdminUI();if($('#pa-btn'))$('#pa-btn').style.display=currentEmail()==='harry@seatsavant.com'?'inline-block':'none';logActivity('session_start',null,{source:'login'});resetAndLoad();refreshTabCounts();refreshNewEventsCount();if(currentEmail()==='harry@seatsavant.com'&&new URLSearchParams(location.search).get('approvals')==='1'){history.replaceState(null,'',location.pathname);openPendingApprovals()}}
// Approval gate: a signed-in account enters the app only if Harry approved it and it has first name, last name and team.
// 2FA with an authenticator app (TOTP). After a password or Google sign-in the session is aal1; a verified code makes it aal2.
// The database (laa_is_approved) also requires aal2, so listing data stays locked until the code is verified.
let MFA_EMAIL='',MFA_FACTOR='',MFA_CHALLENGE='';
function jwtClaims(t){try{let s=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return JSON.parse(atob(s))}catch(e){return {}}}
function tokenAal(t){return jwtClaims(t).aal||'aal1'}
function pwProblem(p){if(p.length<16)return 'Password must be at least 16 characters.';if(!/[a-z]/.test(p)||!/[A-Z]/.test(p))return 'Password must include upper and lower case letters.';if(!/[0-9]/.test(p))return 'Password must include a number.';if(!/[^A-Za-z0-9]/.test(p))return 'Password must include a special character.';return ''}
async function authCall(path,method,body){const r=await fetch(SB+path,{method,headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(Error(d.msg||d.error_description||d.message||('Request failed ('+r.status+')')),{code:d.error_code||d.code||'',status:r.status});return d}
async function mfaChallenge(){const c=await authCall('/auth/v1/factors/'+MFA_FACTOR+'/challenge','POST',{});MFA_CHALLENGE=c.id}
function showMfa(enroll,totp){
  showPanel('#mfaFields');
  $('#mfaSetup').style.display=enroll?'block':'none';
  if(enroll&&totp){const q=totp.qr_code||'';$('#mfaQr').src=q.startsWith('<')?'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(q):q;$('#mfaSecret').textContent='Cannot scan? Enter this key: '+(totp.secret||'')}
  $('#mfaPrompt').textContent=enroll?'Then enter the 6-digit code the app shows.':'Enter the 6-digit code from your authenticator app.';
  $('#mfaCode').value='';
  showAuthMsg('');
}
async function afterPasswordAuth(email){
  MFA_EMAIL=email;
  if(tokenAal(TOKEN)==='aal2')return gateAndEnter(email);
  try{
    const u=await authCall('/auth/v1/user','GET');
    const factors=u.factors||[];
    const verified=factors.find(f=>f.factor_type==='totp'&&f.status==='verified');
    if(verified){MFA_FACTOR=verified.id;await mfaChallenge();showMfa(false);return false}
    for(const f of factors){if(f.status!=='verified'){try{await authCall('/auth/v1/factors/'+f.id,'DELETE')}catch(e){}}}
    const f=await authCall('/auth/v1/factors','POST',{factor_type:'totp',friendly_name:'Authenticator '+Date.now()});
    MFA_FACTOR=f.id;await mfaChallenge();showMfa(true,f.totp);return false;
  }catch(err){clearAuthSession();showPanel('#signinFields');showAuthMsg('Could not start 2-step sign-in: '+err.message+' Please try again.');return false}
}
async function submitMfaCode(){
  const code=$('#mfaCode').value.trim();
  if(!/^\d{6}$/.test(code)){showAuthMsg('Enter the 6-digit code from your authenticator app.');return}
  showAuthMsg('Checking code...');
  try{
    let d;
    try{d=await authCall('/auth/v1/factors/'+MFA_FACTOR+'/verify','POST',{challenge_id:MFA_CHALLENGE,code})}
    catch(err){if(err.code==='mfa_challenge_expired'){await mfaChallenge();showAuthMsg('That code expired. Enter the new code.');return}throw err}
    TOKEN=d.access_token;REFRESH=d.refresh_token||'';
    await gateAndEnter(MFA_EMAIL);
  }catch(err){showAuthMsg(err.message||'Wrong code. Try again.')}
}
function cancelMfa(){clearAuthSession();MFA_FACTOR='';MFA_CHALLENGE='';showPanel('#signinFields');showAuthMsg('')}async function gateAndEnter(email){if(tokenAal(TOKEN)!=='aal2')return afterPasswordAuth(email);const row=await listingAccessRow(email,TOKEN);if(row===undefined){clearAuthSession();showPanel('#signinFields');showAuthMsg('Your session expired. Please sign in again.');return false}if(!row||row.approved!==true){clearAuthSession();showPanel('#signinFields');showAuthMsg('Your account is waiting for approval. Harry needs to approve it before you can see listings.');return false}if(!row.first_name||!row.last_name||!row.team){showPanel('#profileFields');showAuthMsg('Enter your first name, last name, and team to finish.');return false}enterApp();return true}
async function signIn(){const login=$('#email').value.trim().toLowerCase(),email=USERMAP[login]||login,password=$('#password').value;showAuthMsg('Signing in…');const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});const d=await r.json();if(!r.ok||!d.access_token){showAuthMsg(d.error_description||d.msg||'Sign-in failed. Check your username and password, or create an account.');return}TOKEN=d.access_token;REFRESH=d.refresh_token||'';await afterPasswordAuth(email)}
async function createAccount(){const first=$('#firstName').value.trim(),last=$('#lastName').value.trim(),team=$('#teamName').value.trim(),email=$('#signupEmail').value.trim().toLowerCase(),password=$('#signupPassword').value;const pwErr=pwProblem(password);if(!first||!last||!team||!email||pwErr){showAuthMsg(pwErr||'First name, last name, team, and email are all required.');return}showAuthMsg('Creating account…');const r=await fetch(SB+'/auth/v1/signup',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{first_name:first,last_name:last,team:team}})});const d=await r.json();if(!r.ok){showAuthMsg(d.msg||d.error_description||d.message||'Could not create the account.');return}if(d.access_token){TOKEN=d.access_token;REFRESH=d.refresh_token||'';await afterPasswordAuth(email);return}showPanel('#signinFields');showAuthMsg('Account created. Check your email for a confirmation link, then sign in. Harry must approve your account before you can see listings.')}
function signInWithGoogle(){location.href=SB+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.origin+location.pathname)}
async function handleOAuthReturn(){const h=new URLSearchParams(location.hash.replace(/^#/,''));const at=h.get('access_token');if(!at)return false;history.replaceState(null,'',location.pathname+location.search);TOKEN=at;REFRESH=h.get('refresh_token')||'';await afterPasswordAuth(jwtEmail(at));return true}
async function saveProfile(){const first=$('#pFirst').value.trim(),last=$('#pLast').value.trim(),team=$('#pTeam').value.trim();if(!first||!last||!team){showAuthMsg('First name, last name, and team are required.');return}const r=await fetch(SB+'/rest/v1/rpc/laa_save_profile',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+TOKEN,'Content-Type':'application/json'},body:JSON.stringify({p_first:first,p_last:last,p_team:team})});if(!r.ok){showAuthMsg('Could not save your profile. Please try again.');return}await gateAndEnter(jwtEmail(TOKEN))}
$('#loginbtn').onclick=signIn;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});$('#signupbtn').onclick=()=>{showPanel('#signupFields');showAuthMsg('')};$('#backbtn').onclick=()=>{showPanel('#signinFields');showAuthMsg('')};$('#createbtn').onclick=createAccount;$('#googlebtn').onclick=signInWithGoogle;$('#profilebtn').onclick=saveProfile;$('#logout').onclick=()=>{clearSession();location.reload()};
handleOAuthReturn().then(done=>{if(!done&&TOKEN)gateAndEnter(jwtEmail(TOKEN))});
</script></div></body></html>
