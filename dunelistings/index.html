<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dune Listings</title><style>
*{box-sizing:border-box}body{margin:0;font:13px system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f7f9;color:#17202a}header{background:#172536;color:white;padding:16px 24px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:9}h1{font-size:20px;margin:0}.sub,.sync{font-size:12px;color:#cbd5e1}.wrap{max-width:1680px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;margin-bottom:12px}button,select,input{font:inherit}.tabs button,.st,.li{border:1px solid #dce2e8;background:white;border-radius:6px;padding:6px 10px;cursor:pointer;font-weight:650}.tabs .on{background:#172536;color:white}.toolbar{display:flex;gap:8px;flex-wrap:wrap;background:white;border:1px solid #dce2e8;border-radius:8px;padding:10px;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid #dce2e8;border-radius:6px;padding:8px}.toolbar input{flex:1;min-width:260px}.cnt{margin-left:auto;color:#687586;padding:8px}.grp,.flat{background:white;border:1px solid #dce2e8;border-radius:8px;overflow:hidden;margin-bottom:12px}.gt{background:#e9edf2;padding:10px 12px;font-weight:750}table{border-collapse:collapse;width:100%;table-layout:fixed}th{background:#f8fafb;color:#667085;font-size:10px;text-transform:uppercase;text-align:left;padding:7px;border-bottom:1px solid #dce2e8}td{padding:8px;border-bottom:1px solid #edf0f3;vertical-align:top;line-height:1.35;font-size:12px}.ev{font-weight:700}.url{display:block;color:#1762ad;word-break:break-all;text-decoration:none}.why{color:#465365}.src{color:#657286;font-size:11px}.p{font-weight:750;font-size:10px;padding:3px 6px;border-radius:5px;background:#f2f3f5}.p.MUST{background:#fdf0d8}.p.STRONG{background:#eaf4e9}.cs{display:flex;gap:3px;flex-wrap:wrap}.st,.li{font-size:10px;padding:4px 6px}.st.on{background:#dbeafe;border-color:#7aa7dc}.st.ot.on{background:#f2e5fb;border-color:#b78bd7}.li.on{background:#e7f6ea;border-color:#8dc799}.note{display:block;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#70408c;font-size:10px;margin-top:3px}.modalbg{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;z-index:99}.modalbg.on{display:flex}.modal{background:white;width:min(420px,92vw);border-radius:9px;padding:18px}.modal h3{margin:0 0 5px}.modal p{color:#687586;font-size:12px}.modal textarea{width:100%;min-height:80px;border:1px solid #dce2e8;border-radius:6px;padding:8px}.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:9px}.ma button{border:1px solid #dce2e8;border-radius:6px;padding:7px 12px;background:white}.ma .save{background:#172536;color:white}.empty{text-align:center;padding:35px;background:white;border:1px solid #dce2e8;border-radius:8px;color:#687586}.saving{opacity:.5;pointer-events:none}
.c1{width:68px}.c2{width:175px}.c3{width:125px}.c4{width:215px}.c5{width:215px}.c6{width:75px}.c7{width:300px}.c8{width:295px}.c9{width:125px}@media(max-width:900px){.wrap{padding:10px}.toolbar input{min-width:100%}.grp,.flat{overflow-x:auto}table{min-width:1300px}}
</style></head><body><header><div><h1>Dune Listings</h1><div class="sub">Shared event-listing workflow</div></div><div class="sync" id="sync">Loading…</div></header><div class="wrap">
<div class="tabs"><button data-v="master" class="on">Master</button><button data-v="venues">Venues</button><button data-v="events">Events</button></div>
<div class="toolbar"><input id="q" placeholder="Search event, venue, city, source…"><select id="lf"><option value="all">All listing status</option><option value="unlisted">Not listed</option><option value="listed">Listed</option></select><select id="pf"><option value="all">All priorities</option><option>MUST</option><option>STRONG</option><option>MEDIUM</option></select><select id="tf"><option value="all">All tags</option><option>SO</option><option>ISO</option><option>NS</option><option>OTHER</option><option value="none">No tag</option></select><div id="cnt" class="cnt"></div></div><div id="c"></div></div>
<div id="mb" class="modalbg"><div class="modal"><h3>Other</h3><p id="me"></p><textarea id="mn" maxlength="250" placeholder="Short note"></textarea><div class="ma"><button id="mc">Cancel</button><button id="ms" class="save">Save</button></div></div></div>
<script>
const API='https://rpngmxrgjmcjzhgaoegq.supabase.co/rest/v1/listing_events',KEY='sb_publishable_EtA1OzLOhSraN9y8gKpp1g_hCZy8iCg',VEN=new Set(["BOSTON - SYMPHONY HALL","CHICAGO - SYMPHONY CTR","DENVER - BOETTCHER","JAX - JACOBY","NASHVILLE - SCHERMERHORN","NYC - CARNEGIE","NYC - GEFFEN","PHILA - ACADEMY","PHILA - MARIAN","PHILA - MET","PHX - ORPHEUM","PHX - SYMPHONY HALL","PITTSBURGH - BENEDUM","PITTSBURGH - HEINZ","PORTLAND - SCHNITZER","SALT LAKE - ECCLES","SEATTLE - BENAROYA","SF - DAVIES","STRATHMORE"]);let D=[],v='master',M=null;const $=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function tag(x){return x.so?'SO':x.iso?'ISO':x.ns?'NS':x.other?'OTHER':''}
async function load(){let r=await fetch(API+'?select=*&order=sort_index.asc',{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});if(!r.ok)throw Error();D=await r.json();$('#sync').textContent='Live · shared';render()}
function filt(){let a=D.slice();if(v==='venues')a=a.filter(x=>VEN.has(x.source_tab));let q=$('#q').value.trim().toLowerCase();if(q)a=a.filter(x=>[x.group_name,x.event_name,x.venue,x.source_tab,x.why_priority].some(y=>String(y||'').toLowerCase().includes(q)));let f=$('#lf').value;if(f==='listed')a=a.filter(x=>x.listed);if(f==='unlisted')a=a.filter(x=>!x.listed);f=$('#pf').value;if(f!=='all')a=a.filter(x=>x.priority===f);f=$('#tf').value;if(f==='none')a=a.filter(x=>!tag(x));else if(f!=='all')a=a.filter(x=>tag(x)===f);return a}
const cg='<col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"><col class="c6"><col class="c7"><col class="c8"><col class="c9">',hd='<thead><tr><th>Listed</th><th>Status</th><th>Date(s)</th><th>Event</th><th>Venue</th><th>Priority</th><th>Why Priority</th><th>Full Primary URL</th><th>Source</th></tr></thead>';
function row(x){let t=tag(x);return '<tr data-id="'+x.id+'"><td><button class="li '+(x.listed?'on':'')+'" data-l>'+(x.listed?'✓ Listed':'Listed')+'</button></td><td><div class="cs">'+['SO','ISO','NS','OTHER'].map(z=>'<button class="st '+(z==='OTHER'?'ot ':'')+(t===z?'on':'')+'" data-t="'+z+'">'+z+'</button>').join('')+'</div>'+(x.other_note?'<span class="note" title="'+e(x.other_note)+'">'+e(x.other_note)+'</span>':'')+'</td><td>'+e(x.date_text)+'</td><td class="ev">'+e(x.event_name)+'</td><td>'+e(x.venue)+'</td><td><span class="p '+e(x.priority)+'">'+e(x.priority)+'</span></td><td class="why">'+e(x.why_priority)+'</td><td><a class="url" target="_blank" rel="noopener" href="'+e(x.primary_url)+'">'+e(x.primary_url)+'</a></td><td class="src">'+e(x.source_tab)+'</td></tr>'}
function render(){let a=filt();$('#cnt').textContent=a.length+' engagement'+(a.length===1?'':'s');if(!a.length){$('#c').innerHTML='<div class="empty">No matching events.</div>';return}if(v==='master'){$('#c').innerHTML='<div class="flat"><table><colgroup>'+cg+'</colgroup>'+hd+'<tbody>'+a.map(row).join('')+'</tbody></table></div>';bind();return}let k=v==='venues'?'venue':'group_name',g=new Map();a.forEach(x=>{let z=x[k]||'Other';if(!g.has(z))g.set(z,[]);g.get(z).push(x)});$('#c').innerHTML=[...g].map(([z,r])=>'<section class="grp"><div class="gt">'+e(z)+' <span style="font-weight:500;color:#687586">· '+r.length+'</span></div><table><colgroup>'+cg+'</colgroup>'+hd+'<tbody>'+r.map(row).join('')+'</tbody></table></section>').join('');bind()}
function bind(){document.querySelectorAll('tr[data-id]').forEach(tr=>{let x=D.find(y=>y.id==tr.dataset.id);tr.querySelector('[data-l]').onclick=()=>save(x,{listed:!x.listed});tr.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>clicktag(x,b.dataset.t))})}
async function save(x,p){let tr=document.querySelector('tr[data-id="'+x.id+'"]');if(tr)tr.classList.add('saving');let r=await fetch(API+'?id=eq.'+x.id,{method:'PATCH',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify({...p,updated_at:new Date().toISOString()})});if(!r.ok){alert('Could not save.');render();return}let a=await r.json();Object.assign(x,a[0]||p);$('#sync').textContent='Saved';setTimeout(()=>$('#sync').textContent='Live · shared',700);render()}
function clicktag(x,t){if(t==='OTHER'){M=x;$('#me').textContent=x.event_name+' · '+x.venue;$('#mn').value=x.other_note||'';$('#mb').classList.add('on');setTimeout(()=>$('#mn').focus(),20);return}let k=t.toLowerCase(),on=!!x[k];save(x,{so:false,iso:false,ns:false,other:false,other_note:'',[k]:!on})}
$('.tabs').onclick=a=>{let b=a.target.closest('button[data-v]');if(!b)return;v=b.dataset.v;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));render()};['q','lf','pf','tf'].forEach(i=>$('#'+i).addEventListener(i==='q'?'input':'change',render));$('#mc').onclick=()=>{$('#mb').classList.remove('on');M=null};$('#mb').onclick=x=>{if(x.target===$('#mb'))$('#mc').click()};$('#ms').onclick=()=>{if(!M)return;let x=M,n=$('#mn').value.trim();$('#mb').classList.remove('on');M=null;save(x,{so:false,iso:false,ns:false,other:true,other_note:n})};load().catch(()=>{$('#sync').textContent='Connection error';$('#c').innerHTML='<div class="empty">Unable to load shared listings.</div>'});
</script></body></html>
